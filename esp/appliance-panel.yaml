esphome:
  name: agile-panel
  on_boot:
    - priority: 600
      then:
        - switch.turn_on: epd_power
        - delay: 500ms
    - priority: -100
      then:
        - wait_until:
            condition:
              wifi.connected:
        - component.update: panel_png

external_components:
  - source: github://ESPBoards/esphome-lvgl-crowpanel-epaper-5.79-4.2@main

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

http_request:
  timeout: 10s

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

switch:
  - platform: gpio
    pin: 7
    id: epd_power
    restore_mode: ALWAYS_ON
    internal: true

image:
  - platform: online_image
    id: panel_png
    url: !secret panel_url
    format: PNG
    type: BINARY
    update_interval: 30min
    on_download_finished:
      - component.update: epd

display:
  - platform: crowpanel_epaper
    id: epd
    model: "5.79in"
    clk_pin: 12
    mosi_pin: 11
    cs_pin: 45
    dc_pin: 46
    reset_pin: 47
    busy_pin: 48
    invert_colors: true
    auto_clear_enabled: false
    full_update_every: 48
    update_interval: never
    lambda: |-
      it.image(0, 0, id(panel_png));